plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'to.sealed'
version = '0.1.0'

// The Rust decoder is cross-compiled by `task build:facet-android` into src/main/jniLibs/<abi>/libsealed_facet.so
// (git-ignored). The JNI shim (src/main/cpp) links against it; without the library the module builds without
// the shim and reports the native decoder as unavailable.
def jniLibs = file("src/main/jniLibs")
def hasLibrary = jniLibs.isDirectory() && jniLibs.listFiles()?.any { it.isDirectory() && new File(it, "libsealed_facet.so").exists() }

android {
  namespace "to.sealed.facet"
  defaultConfig {
    minSdkVersion 31
    versionCode 1
    versionName '0.1.0'
    if (hasLibrary) {
      externalNativeBuild {
        cmake {
          arguments "-DANDROID_STL=c++_shared"
          abiFilters jniLibs.listFiles().findAll { it.isDirectory() }.collect { it.name } as String[]
        }
      }
    }
  }
  if (hasLibrary) {
    externalNativeBuild {
      cmake {
        path "src/main/cpp/CMakeLists.txt"
        version "3.22.1"
      }
    }
  }
}

dependencies {
  implementation "androidx.core:core-ktx:1.17.0"
}
