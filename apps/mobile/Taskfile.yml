# Mobile app lifecycle (go-task). Run from apps/mobile or with `task -d apps/mobile <target>`.
version: "3"

tasks:
  setup:
    desc: Install dependencies and create .env from the template
    cmds:
      - task: install
      - task: setup:env

  setup:env:
    desc: Create .env from the template if missing
    cmds:
      - cmd: test -f .env || cp .env.example .env

  install:
    desc: Install workspace dependencies
    dir: ../..
    cmds:
      - pnpm install --frozen-lockfile

  typecheck:
    cmds:
      - pnpm typecheck

  test:
    desc: Unit tests (storage, at-rest encryption, hardware-key binding, routing, optical decode)
    cmds:
      - pnpm test

  doctor:
    cmds:
      - npx expo-doctor

  export:
    desc: Bundle both platforms with Metro/Hermes (no native toolchain needed)
    cmds:
      - npx expo export --platform ios --platform android --output-dir dist

  build:
    desc: Bundle both platforms with Metro/Hermes into dist/
    cmds:
      - task: export

  clean:
    desc: Remove build output, Expo cache, generated native builds, and test artifacts
    cmds:
      - rm -rf dist .expo ios android coverage

  prebuild:
    desc: Generate ios/ and android/ (not committed)
    cmds:
      - npx expo prebuild --clean

  ios:
    desc: Build and run a development build on a connected iPhone (needs Xcode)
    cmds:
      - npx expo run:ios --device

  android:
    desc: Build and run a development build on a connected Android phone (needs the Android SDK)
    cmds:
      - npx expo run:android --device

  start:
    desc: Metro for an installed development build
    cmds:
      - npx expo start --dev-client
