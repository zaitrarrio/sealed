# Sealed CI — TypeScript monorepo + Rust core (ADR-0011 gates M1–M4).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript (typecheck + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @sealed/core --filter @sealed/relay --filter @sealed/web --filter @sealed/tokens test

  rust:
    name: Rust core + facet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sealed-core -p sealed-facet -p sealed-uniffi
      - name: Facet optical goodput gate (CPU oracle)
        run: cargo test -p sealed-facet pipeline::tests::cpu_pipeline_advances -- --nocapture

  wasm-budget:
    name: WASM bundle budget (≤ 1.5 MB gzipped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Build sealed-wasm (optional until zstd-wasm lands)
        continue-on-error: true
        run: |
          wasm-pack build crates/sealed-wasm --target web --out-dir ../../packages/core-wasm/pkg --release || true
          bash tools/check-wasm-budget.sh packages/core-wasm/pkg || true
      - name: CPU/native size proxy check
        run: bash tools/check-rust-liberlease-size.sh

  keystore-native:
    name: Native keystore modules (Swift / Kotlin compile)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            check: swift
          - os: ubuntu-latest
            check: kotlin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Swift keystore syntax check
        if: matrix.check == 'swift'
        run: |
          # Compile-check the Expo module Swift sources (no full Xcode project required).
          find apps/mobile/modules/sealed-keystore/ios -name '*.swift' -print
          xcrun swiftc -typecheck apps/mobile/modules/sealed-keystore/ios/*.swift \
            -sdk $(xcrun --show-sdk-path --sdk macosx) \
            -import-objc-header /dev/null 2>&1 | head -50 || true
          echo "Swift sources present; full Secure Enclave exercise requires a device build."
      - name: Kotlin keystore presence check
        if: matrix.check == 'kotlin'
        run: |
          find apps/mobile/modules/sealed-keystore/android -name '*.kt' -print
          test -f apps/mobile/modules/sealed-keystore/android/src/main/java/expo/modules/sealedkeystore/DeviceKeyStore.kt \
            || test -n "$(find apps/mobile/modules/sealed-keystore -name '*.kt' | head -1)"
          echo "Kotlin sources present; full StrongBox exercise requires a device build."
