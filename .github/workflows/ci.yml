# Sealed CI — TypeScript monorepo + Rust core (ADR-0011 gates M1–M4).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ts:
    name: TypeScript (typecheck + unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
      - run: pnpm --filter @sealed/core --filter @sealed/relay --filter @sealed/web --filter @sealed/tokens test

  rust:
    name: Rust core + facet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p sealed-core -p sealed-facet --release

  facet-wasm:
    name: Native grid decoder → WebAssembly (parity in Node, ≤ 1.5 MB gzipped)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash tools/build-facet-wasm.sh
      - run: bash tools/check-wasm-budget.sh packages/core/wasm
      - name: Grid fixtures + wasm parity and speed test
        run: |
          pnpm --filter @sealed/core fixtures:grid
          pnpm --filter @sealed/core exec vitest run test/facet/native.test.ts

  keystore-native:
    name: Native modules (Swift / Kotlin presence and syntax)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            check: swift
          - os: ubuntu-latest
            check: kotlin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Swift keystore syntax check
        if: matrix.check == 'swift'
        run: |
          # Compile-check the Expo module Swift sources (no full Xcode project required).
          find apps/mobile/modules/sealed-keystore/ios -name '*.swift' -print
          xcrun swiftc -typecheck apps/mobile/modules/sealed-keystore/ios/*.swift \
            -sdk $(xcrun --show-sdk-path --sdk macosx) \
            -import-objc-header /dev/null 2>&1 | head -50 || true
          echo "Swift sources present; full Secure Enclave exercise requires a device build."
          find apps/mobile/modules/sealed-facet/ios -name '*.swift' -print
          xcrun swiftc -typecheck apps/mobile/modules/sealed-facet/ios/*.swift \
            -sdk $(xcrun --show-sdk-path --sdk macosx) 2>&1 | head -50 || true
      - name: Kotlin keystore presence check
        if: matrix.check == 'kotlin'
        run: |
          find apps/mobile/modules/sealed-keystore/android -name '*.kt' -print
          test -f apps/mobile/modules/sealed-keystore/android/src/main/java/expo/modules/sealedkeystore/DeviceKeyStore.kt \
            || test -n "$(find apps/mobile/modules/sealed-keystore -name '*.kt' | head -1)"
          echo "Kotlin sources present; full StrongBox exercise requires a device build."
          find apps/mobile/modules/sealed-facet/android -name '*.kt' -o -name '*.c' | sort
          test -f apps/mobile/modules/sealed-facet/android/src/main/cpp/jni.c
          # The JNI shim compiles against the C header with a plain C compiler (no NDK needed for syntax).
          sudo apt-get install -y -qq default-jdk-headless >/dev/null
          cc -fsyntax-only -I crates/sealed-facet/include -I "$(dirname "$(dirname "$(readlink -f "$(which javac)")")")/include" -I "$(dirname "$(dirname "$(readlink -f "$(which javac)")")")/include/linux" apps/mobile/modules/sealed-facet/android/src/main/cpp/jni.c
